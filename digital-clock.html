<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
        }

        .clock {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .timezone-name {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 48px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
        }

        .date-display {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .period {
            color: #00ff88;
            font-weight: bold;
            margin-left: 10px;
        }

        .offset {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            margin-top: 8px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 22px;
                margin-bottom: 30px;
            }

            .time-display {
                font-size: 36px;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            }
        }

        .time-display.active {
            animation: glow 1s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">🌍 World Clock</h1>
        <div class="clocks-grid" id="clocksContainer"></div>
    </div>

    <script>
        // Define timezones to display
        const timezones = [
            { name: 'New York', tz: 'America/New_York' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'Singapore', tz: 'Asia/Singapore' },
            { name: 'Los Angeles', tz: 'America/Los_Angeles' },
            { name: 'Paris', tz: 'Europe/Paris' },
        ];

        // Initialize clocks
        function initializeClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';

            timezones.forEach(({ name, tz }) => {
                const clockDiv = document.createElement('div');
                clockDiv.className = 'clock';
                clockDiv.innerHTML = `
                    <div class="timezone-name">${name}</div>
                    <div class="time-display" data-timezone="${tz}">--:--:--</div>
                    <div class="date-display" data-date="${tz}">Loading...</div>
                    <div class="offset" data-offset="${tz}"></div>
                `;
                container.appendChild(clockDiv);
            });

            updateClocks();
        }

        // Update all clocks
        function updateClocks() {
            const now = new Date();

            timezones.forEach(({ name, tz }) => {
                const timeElement = document.querySelector(`[data-timezone="${tz}"]`);
                const dateElement = document.querySelector(`[data-date="${tz}"]`);
                const offsetElement = document.querySelector(`[data-offset="${tz}"]`);

                // Get time in specific timezone
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false,
                });

                const dateFormatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                });

                // Get timezone offset
                const tzTime = new Date(now.toLocaleString('en-US', { timeZone: tz }));
                const offset = (tzTime - now) / (1000 * 60 * 60);
                const offsetHours = Math.abs(Math.floor(offset));
                const offsetMinutes = Math.abs((offset % 1) * 60);
                const offsetSign = offset >= 0 ? '+' : '-';
                const offsetStr = `UTC ${offsetSign}${String(offsetHours).padStart(2, '0')}:${String(offsetMinutes).padStart(2, '0')}`;

                timeElement.textContent = formatter.format(now);
                dateElement.textContent = dateFormatter.format(now);
                offsetElement.textContent = offsetStr;
            });
        }

        // Update clocks every second
        initializeClocks();
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
